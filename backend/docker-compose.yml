name: orthocare-dev

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: orthocare-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: orthocare
      POSTGRES_PASSWORD: orthocare_dev_password
      POSTGRES_DB: orthocare
    ports:
      # Local dev only - bind to loopback, never expose publicly.
      # Host port 5433 (not 5432) to avoid colliding with other local Postgres containers.
      - "127.0.0.1:5433:5432"
    volumes:
      - orthocare_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orthocare -d orthocare"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  orthocare_pg_data:
