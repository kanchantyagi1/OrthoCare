# OrthoCare AI — Nginx reverse proxy for the NestJS backend.
#
# Install:
#   sudo cp orthocare.conf /etc/nginx/sites-available/orthocare.conf
#   sudo ln -s /etc/nginx/sites-available/orthocare.conf /etc/nginx/sites-enabled/orthocare.conf
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS: provision a certificate with certbot before enabling the HTTPS server block below:
#   sudo apt-get install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d api.yourclinic.example
# certbot will rewrite this file to insert the correct ssl_certificate directives —
# the placeholders below show the shape it will produce.

upstream orthocare_backend {
    server 127.0.0.1:3000;  # must match backend .env PORT
    keepalive 32;
}

# Plain HTTP: redirect everything to HTTPS once a cert is issued.
# Until then (first boot, before certbot has run), this also serves the API directly
# over HTTP so you can smoke-test before TLS is configured.
server {
    listen 80;
    listen [::]:80;
    server_name api.yourclinic.example;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        # Comment out this redirect until certbot has issued a certificate.
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.yourclinic.example;

    # ssl_certificate     /etc/letsencrypt/live/api.yourclinic.example/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.yourclinic.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # PDF/DOCX uploads can be a few MB — allow generous body size.
    client_max_body_size 25m;

    # Reasonable timeouts for AI chat calls that may take a few seconds.
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    location / {
        proxy_pass http://orthocare_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://orthocare_backend/health;
        access_log off;
    }
}
