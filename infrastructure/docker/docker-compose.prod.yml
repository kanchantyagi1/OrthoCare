# OrthoCare AI — production-style Docker Compose deployment.
#
# Alternative to the bare-metal infrastructure/aws/setup-ec2.sh path. Use this when you'd
# rather manage the backend + database as containers on a single EC2 host (or any VM) than
# install Node/Postgres directly on the OS. See ./README.md for when to pick which.
#
# This stack is scoped with its own project name ("orthocare") and an isolated network/volumes,
# so it coexists safely alongside an unrelated stack already running on the same host (e.g. one
# started under a different Compose project name/directory) — it won't collide with that other
# stack's networks, volumes, or container names.
#
# No Nginx / TLS / domain here by design: the mobile app talks to the backend directly over
# http://<host>:${BACKEND_HOST_PORT}. Pick a BACKEND_HOST_PORT (in .env) that nothing else on the
# host is already using — check with `ss -tlnp` before first deploy. Add a domain + TLS later
# (either via infrastructure/nginx/orthocare.conf on its own port, or a Let's-Encrypt-friendly
# free DNS like sslip.io) before this handles real patient data in production; plain HTTP is only
# an acceptable stopgap for initial testing.
#
# Usage:
#   cp ../../backend/.env.example .env   # then fill in real production values
#   echo "BACKEND_HOST_PORT=8081" >> .env   # or whatever free port you picked
#   docker compose -f docker-compose.prod.yml up -d --build

name: orthocare

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orthocare}
      POSTGRES_USER: ${POSTGRES_USER:-orthocare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - orthocare_pgdata:/var/lib/postgresql/data
    networks:
      - orthocare_internal
    # Deliberately NOT published to the host/public internet — only the backend
    # container reaches it, over the internal network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orthocare}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - orthocare_uploads:/app/storage
    ports:
      - "0.0.0.0:${BACKEND_HOST_PORT:-8081}:3000"  # reachable directly by the mobile app
    networks:
      - orthocare_internal

networks:
  orthocare_internal:
    driver: bridge

volumes:
  orthocare_pgdata:
  orthocare_uploads:
