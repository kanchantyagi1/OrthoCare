name: orthocare_ai
description: "Prime Ortho — Expert Care. Faster Recovery."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  flutter_riverpod: ^2.5.1

  # Networking
  dio: ^5.4.3+1

  # Routing
  go_router: ^14.2.0

  # Secure session storage
  flutter_secure_storage: ^11.2.0

  # Push notifications (guarded — app runs fine without a configured Firebase project)
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0

  # Utilities
  intl: ^0.19.0
  url_launcher: ^6.3.3
  file_picker: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
