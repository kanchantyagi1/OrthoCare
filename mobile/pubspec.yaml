name: orthocare_ai
description: "OrthoCare AI — AI Support. Human Care. Better Recovery."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  flutter_riverpod: ^2.5.1

  # Networking
  dio: ^5.4.3+1

  # Routing
  go_router: ^14.2.0

  # Secure session storage
  flutter_secure_storage: ^9.2.2

  # Push notifications (guarded — app runs fine without a configured Firebase project)
  firebase_core: ^3.1.0
  firebase_messaging: ^15.0.1

  # Utilities
  intl: ^0.19.0
  url_launcher: ^6.3.0
  file_picker: ^8.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
