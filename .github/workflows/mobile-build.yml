name: Mobile APK build

# Builds the Flutter app in mobile/ in the cloud, so no local Flutter/Android
# SDK is needed on a dev machine. Triggers on pushes that touch mobile/, and
# can always be run manually from the Actions tab.
on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-build.yml"
  pull_request:
    paths:
      - "mobile/**"
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Backend API base URL to bake into this build"
        required: false
        default: "http://100.59.151.247:8081"

jobs:
  build:
    name: Analyze, test, build APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java (required by Android Gradle build)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze
        continue-on-error: true # first CI run: surface issues without blocking the APK build

      - name: flutter test
        run: flutter test
        continue-on-error: true # no widget tests exist yet (see mobile/README.md known gaps)

      # Optional release signing: only runs if these repo secrets are set.
      # Without them, the build falls back to Flutter's default debug signing,
      # which is fine for internal testing but not for Play Store distribution.
      - name: Decode release keystore (optional)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=release.jks
          EOF

      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL=${{ github.event.inputs.api_base_url || 'http://100.59.151.247:8081' }}

      - name: Build release AAB (Play Store bundle)
        run: |
          flutter build appbundle --release \
            --dart-define=API_BASE_URL=${{ github.event.inputs.api_base_url || 'http://100.59.151.247:8081' }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: orthocare-ai-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: orthocare-ai-release-aab
          path: mobile/build/app/outputs/bundle/release/app-release.aab
          retention-days: 14
