name: Mobile APK build

# Builds the Flutter app in mobile/ in the cloud, so no local Flutter/Android
# SDK is needed on a dev machine. Triggers on pushes that touch mobile/, and
# can always be run manually from the Actions tab.
on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-build.yml"
  pull_request:
    paths:
      - "mobile/**"
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Backend API base URL to bake into this build"
        required: false
        default: "http://100.59.151.247:8081"
      build_apk:
        description: "Also build the debug/sideload APK (off by default - AAB only, for Play Console)"
        type: boolean
        required: false
        default: false

jobs:
  build:
    name: Analyze, test, build APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java (required by Android Gradle build)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # Pinned, not "channel: stable": the android/ scaffold is generated by a specific
      # Flutter version and its Gradle/AGP/Kotlin versions must match it. Tracking a
      # moving "stable" silently broke the build once already. Bump this deliberately,
      # regenerating android/ with `flutter create --platforms=android .` when you do.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          cache: true

      - name: flutter pub get
        run: flutter pub get

      # NOT continue-on-error: this previously hid 7 real compile errors
      # (undefined apiClientProvider) while the job still reported the step green.
      - name: flutter analyze
        run: flutter analyze

      # Optional release signing: only runs if these repo secrets are set.
      # Without them, the build falls back to Flutter's default debug signing,
      # which is fine for internal testing but not for Play Store distribution.
      - name: Decode release keystore (optional)
        # `secrets` can't be referenced in a step `if:` condition (GitHub Actions
        # restriction) - so the conditional lives inside the shell script instead.
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.jks
            cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=release.jks
          EOF
          else
            echo "No release keystore secrets configured - building with Flutter's default debug signing."
          fi

      # Off by default: Play Console only ever needs the AAB. Run manually from the
      # Actions tab with build_apk=true when a sideloadable APK is actually needed.
      - name: Build release APK (optional)
        if: github.event.inputs.build_apk == 'true'
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL=${{ github.event.inputs.api_base_url || 'http://100.59.151.247:8081' }}

      - name: Build release AAB (Play Store bundle)
        run: |
          flutter build appbundle --release \
            --dart-define=API_BASE_URL=${{ github.event.inputs.api_base_url || 'http://100.59.151.247:8081' }}

      - name: Upload APK artifact
        if: github.event.inputs.build_apk == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: prime-ortho-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: prime-ortho-release-aab
          path: mobile/build/app/outputs/bundle/release/app-release.aab
          retention-days: 14
